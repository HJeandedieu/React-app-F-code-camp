<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shopping List</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #f5f0e8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'DM Sans', sans-serif;
      padding: 24px;
    }

    .card {
      background: #fffdf8;
      border-radius: 24px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 48px rgba(80,60,30,0.13);
      overflow: hidden;
    }

    /* Header */
    .header {
      background: #2d2926;
      padding: 30px 28px 26px;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      top: -50px; right: -50px;
      width: 160px; height: 160px;
      border-radius: 50%;
      background: rgba(161,196,100,0.10);
    }
    .header::after {
      content: '';
      position: absolute;
      bottom: -30px; left: 60px;
      width: 90px; height: 90px;
      border-radius: 50%;
      background: rgba(161,196,100,0.06);
    }
    .header-text .subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      color: #a1c464;
      font-size: 13px;
      letter-spacing: 2px;
      margin-bottom: 4px;
    }
    .header-text h1 {
      font-family: 'Playfair Display', serif;
      font-weight: 400;
      color: #fffdf8;
      font-size: 34px;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    .badge {
      background: #a1c464;
      color: #2d2926;
      border-radius: 14px;
      padding: 8px 16px;
      text-align: center;
      line-height: 1;
      position: relative;
      z-index: 1;
    }
    .badge .num { font-size: 26px; font-weight: 700; display: block; }
    .badge .lbl { font-size: 10px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }

    /* Search */
    .search-wrap {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 20px 24px 4px;
      border-bottom: 1.5px solid #ede8df;
      margin: 0 24px;
    }
    .search-icon { font-size: 16px; color: #b0a99e; }
    .search-wrap input {
      flex: 1;
      border: none;
      background: transparent;
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 15px;
      color: #2d2926;
      outline: none;
      padding-bottom: 8px;
    }
    .search-wrap input::placeholder { color: #c5bdb0; }

    /* List */
    .list { padding: 20px 24px; }

    .group { margin-bottom: 20px; }
    .group-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #b0a99e;
      margin-bottom: 8px;
      padding-left: 4px;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 12px;
      margin-bottom: 3px;
      cursor: pointer;
      transition: background 0.15s;
    }
    .item:hover { background: #f5f0e8; }

    .checkbox {
      width: 20px; height: 20px;
      border-radius: 6px;
      border: 1.5px solid #c8c2b4;
      flex-shrink: 0;
    }
    .item.checked .checkbox {
      background: #5c7a4e;
      border-color: #5c7a4e;
      display: flex; align-items: center; justify-content: center;
    }
    .item.checked .checkbox::after {
      content: '';
      display: block;
      width: 10px; height: 7px;
      border-left: 2px solid white;
      border-bottom: 2px solid white;
      transform: rotate(-45deg) translateY(-1px);
    }

    .emoji { font-size: 18px; line-height: 1; }

    .item-name {
      font-size: 15px;
      color: #2d2926;
    }
    .item.checked .item-name {
      text-decoration: line-through;
      color: #b0a99e;
    }
    .item.checked { opacity: 0.5; }

    /* Add Item */
    .add-wrap {
      display: flex;
      gap: 10px;
      padding: 4px 24px 22px;
      align-items: center;
    }
    .add-wrap input {
      flex: 1;
      border: 1.5px solid #e0d9cc;
      border-radius: 12px;
      padding: 10px 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: #2d2926;
      background: #faf7f0;
      outline: none;
    }
    .add-wrap input::placeholder { color: #c5bdb0; }
    .add-btn {
      background: #a1c464;
      border: none;
      border-radius: 12px;
      width: 40px; height: 40px;
      font-size: 24px;
      color: #2d2926;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-weight: 300;
      transition: background 0.15s;
    }
    .add-btn:hover { background: #8fb050; }

    /* Scrollbar */
    .list::-webkit-scrollbar { width: 4px; }
    .list::-webkit-scrollbar-thumb { background: #e0d9cc; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="card">

    <div class="header">
      <div class="header-text">
        <p class="subtitle">Today's</p>
        <h1>Shopping List</h1>
      </div>
      <div class="badge">
        <span class="num">8</span>
        <span class="lbl">left</span>
      </div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" placeholder="Search items..." />
    </div>

    <div class="list">

      <div class="group">
        <p class="group-label">Fruits</p>
        <div class="item checked"><div class="checkbox"></div><span class="emoji">🍎</span><span class="item-name">Apples</span></div>
        <div class="item"><div class="checkbox"></div><span class="emoji">🍌</span><span class="item-name">Bananas</span></div>
        <div class="item checked"><div class="checkbox"></div><span class="emoji">🍓</span><span class="item-name">Strawberries</span></div>
        <div class="item"><div class="checkbox"></div><span class="emoji">🫐</span><span class="item-name">Blueberries</span></div>
        <div class="item"><div class="checkbox"></div><span class="emoji">🥭</span><span class="item-name">Mangoes</span></div>
        <div class="item"><div class="checkbox"></div><span class="emoji">🍍</span><span class="item-name">Pineapple</span></div>
      </div>

      <div class="group">
        <p class="group-label">Vegetables</p>
        <div class="item"><div class="checkbox"></div><span class="emoji">🥬</span><span class="item-name">Lettuce</span></div>
        <div class="item"><div class="checkbox"></div><span class="emoji">🥦</span><span class="item-name">Broccoli</span></div>
      </div>

      <div class="group">
        <p class="group-label">Household</p>
        <div class="item"><div class="checkbox"></div><span class="emoji">🧻</span><span class="item-name">Paper Towels</span></div>
        <div class="item checked"><div class="checkbox"></div><span class="emoji">🧴</span><span class="item-name">Dish Soap</span></div>
      </div>

    </div>

    <div class="add-wrap">
      <input type="text" placeholder="Add a new item..." />
      <button class="add-btn">+</button>
    </div>

  </div>
</body>
</html>
